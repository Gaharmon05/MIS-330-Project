<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StyleHub</title>
  <link rel="stylesheet" href="Client_Resources/Styles/index.css">
</head>
<body>
  <!--
    StyleHub -- JavaScript version.
    This file is only the empty frame of the one page. index.js asks the
    Python API (Files/API/api.py) for data with fetch() and draws each
    section inside #content.
  -->
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content" id="content"></main>
    </div>
  </div>
  <div class="toast-stack" id="toasts" aria-live="polite"></div>

  <script src="Client_Resources/Scripts/index.js"></script>
</body>
</html>
